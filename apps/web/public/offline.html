<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline - Branch Pulse</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #0f172a; text-align: center; padding: 24px; }
    h1 { color: #2563eb; margin-bottom: 8px; }
    button { min-height: 48px; padding: 0 24px; font-size: 16px; font-weight: 600; border-radius: 12px; border: 0; background: #2563eb; color: #fff; }
  </style>
</head>
<body>
  <main>
    <h1>You are offline</h1>
    <p>Open a screen you have used before, or reconnect. Entries you saved are kept on this phone and will sync automatically.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
